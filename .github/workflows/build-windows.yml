name: Build ktorrent for Windows (Qt6 + MinGW)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Base Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            ninja-build \
            zip \
            ca-certificates

      # 1. Setup vcpkg with MinGW triplet
      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
          
          # 安装依赖：使用 x64-mingw-dynamic 三元组
          # 注意：ktorrent 依赖较多，这里列出了核心 KDE 依赖，如果报错缺包请在此处追加
          ./vcpkg install \
            qt6-base:x64-mingw-dynamic \
            qt6-tools:x64-mingw-dynamic \
            qt6-svg:x64-mingw-dynamic \
            kcoreaddons:x64-mingw-dynamic \
            ki18n:x64-mingw-dynamic \
            kconfig:x64-mingw-dynamic \
            kwindowsystem:x64-mingw-dynamic \
            knotifications:x64-mingw-dynamic

      # 2. Configure & Build
      - name: Configure & Build
        run: |
          mkdir -p build
          cd build
          
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-mingw-dynamic \ # 关键：告诉 vcpkg 我们用的是 MinGW
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_INSTALL_PREFIX=../install

          cmake --build . --target all -- -j$(nproc)

      # 3. Package (Manual DLL collection for MinGW)
      - name: Package with Dependencies
        run: |
          mkdir -p release
          
          # 复制主程序
          cp build/ktorrent.exe release/
          
          # 手动收集 DLL (MinGW 和 Qt 依赖)
          # 获取 vcpkg 安装的 Qt 库路径
          QT_DLL_PATH=$(find vcpkg/installed/x64-mingw-dynamic/bin -name "Qt6*.dll" -exec dirname {} \; | head -n 1)
          
          # 复制所有 Qt6 DLL
          cp $QT_DLL_PATH/Qt6*.dll release/ 2>/dev/null || true
          
          # 复制 MinGW 运行时
          cp /usr/x86_64-w64-mingw32/lib/libgcc_s_seh-1.dll release/ 2>/dev/null || true
          cp /usr/x86_64-w64-mingw32/lib/libstdc++-6.dll release/ 2>/dev/null || true
          cp /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll release/ 2>/dev/null || true
          
          # 复制平台插件 (非常重要)
          mkdir -p release/platforms
          cp $QT_DLL_PATH/platforms/qwindows.dll release/platforms/ 2>/dev/null || true
          
          # 打包
          zip -r ktorrent-windows-qt6.zip release/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ktorrent-windows-qt6
          path: ktorrent-windows-qt6.zip
