name: Build ktorrent for Windows (Qt6 + MSVC)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Ninja
        run: |
          choco install --no-progress ninja

      # 🔥 核心：彻底禁用 Git 所有交互、所有凭证提示
      - name: Disable Git interactive prompts
        run: |
          git config --global core.askPass "false"
          git config --global credential.modalPrompt false
          git config --global --add safe.directory "*"

      # 克隆 vcpkg（官方，稳定）
      - name: Setup vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat

      # 🔥 关键：用 HTTPS 无交互格式克隆，彻底不弹登录
      - name: Clone KDE vcpkg (NO LOGIN)
        run: |
          git clone --depth 1 https://anonymous:@github.com/KDE/kde-vcpkg.git

      # 安装依赖
      - name: Install dependencies
        run: |
          .\vcpkg\vcpkg install `
            --overlay-ports=kde-vcpkg/ports `
            qtbase:x64-windows `
            qttools:x64-windows `
            qtsvg:x64-windows `
            kcoreaddons:x64-windows `
            ki18n:x64-windows `
            kconfig:x64-windows `
            kwindowsystem:x64-windows `
            knotifications:x64-windows

      # 构建
      - name: Configure & Build
        run: |
          mkdir build
          cd build
          cmake .. `
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_OVERLAY_PORTS=../kde-vcpkg/ports `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -GNinja
          cmake --build . --config Release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ktorrent-windows
          path: build/src/Release/ktorrent.exe
