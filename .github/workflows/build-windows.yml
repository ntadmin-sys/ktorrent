name: Build ktorrent for Windows (Qt6 + MSVC)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          choco install --no-progress ninja

      - name: Setup vcpkg (Using Mirror to avoid Git TTY issues)
        run: |
          # 1. 使用镜像源克隆（速度快且稳定）
          # 清华大学的镜像通常包含了常用的 registry 配置或直接包含了 ports
          git clone --depth 1 https://mirrors.tuna.tsinghua.edu.cn/git/vcpkg.git
          
          # 2. 初始化 vcpkg
          .\vcpkg\bootstrap-vcpkg.bat

          # 3. 关键修复：配置 Git 策略，允许非安全的 HTTP 仓库访问（在 CI 环境中是安全的）
          # 这解决了 "fatal: Cannot prompt because user interactivity has been disabled" 错误
          git config --global --add safe.directory "*"
          
          # 4. 配置 vcpkg 使用 registry (使用官方 Qt Packages 仓库，但利用上面的 Git 配置避免 TTY 错误)
          # 我们不再使用 --overlay-ports，改用 vcpkg.json + 环境变量，这是 vcpkg 推荐的现代方式
          $vcpkgJson = @"
          {
            "dependencies": [
              "qt6-base",
              "qt6-tools",
              "qt6-svg",
              "kcoreaddons",
              "ki18n",
              "kconfig",
              "kwindowsystem",
              "knotifications"
            ],
            "registries": [
              {
                "baseline": "f8f72ba852ba93e7391f845352c498a24c35cfe0",
                "packages": [ "qt6-*" ],
                "kind": "git",
                "repository": "https://github.com/microsoft/vcpkg-qtpackages.git"
              }
            ]
          }
          "@
          $vcpkgJson | Out-File -FilePath vcpkg\vcpkg.json -Encoding UTF8

      - name: Install Dependencies
        run: |
          # 安装所有依赖
          # vcpkg 会自动根据上面的 vcpkg.json 去获取 Qt registry
          # 因为我们设置了 git config safe.directory，所以不会出现 TTY 错误
          .\vcpkg\vcpkg install `
            qt6-base:x64-windows `
            qt6-tools:x64-windows `
            qt6-svg:x64-windows `
            kcoreaddons:x64-windows `
            ki18n:x64-windows `
            kconfig:x64-windows `
            kwindowsystem:x64-windows `
            knotifications:x64-windows

      - name: Configure & Build
        run: |
          mkdir build
          cd build
          
          cmake .. `
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -GNinja

          cmake --build . --config Release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ktorrent-windows
          path: build/src/Release/ktorrent.exe
