name: Build ktorrent for Windows (Qt6 + MSVC)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Qt6 (Official Installer, No vcpkg KDE)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtbase qttools qtsvg'

      - name: Install Ninja + CMake
        run: |
          choco install --no-progress ninja cmake

      - name: Configure & Build (No KDE, No vcpkg)
        run: |
          mkdir build
          cd build
          cmake .. `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_KDE_FRAMEWORKS=OFF `
            -GNinja
          cmake --build . --config Release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ktorrent-windows
          path: build/src/Release/ktorrent.exe
