name: Build ktorrent for Windows (Qt6 + MSVC)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Ninja
        run: choco install --no-progress ninja

      - name: Setup vcpkg + KDE ports
        run: |
          git clone --depth 1 https://ghproxy.net/https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          git clone --depth 1 https://ghproxy.net/https://invent.kde.org/sdk/kde-vcpkg.git

      - name: Install all dependencies
        run: |
          .\vcpkg\vcpkg install `
            --overlay-ports=kde-vcpkg/ports `
            qtbase qttools qtsvg `
            kcoreaddons ki18n kconfig kwindowsystem knotifications `
            --triplet=x64-windows

      - name: Build
        run: |
          mkdir build && cd build
          cmake .. `
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_OVERLAY_PORTS=../kde-vcpkg/ports `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -GNinja
          cmake --build . --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: ktorrent-windows
          path: build/src/Release/ktorrent.exe
