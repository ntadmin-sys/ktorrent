name: Build ktorrent for Windows (Qt6 + MSVC)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-windows:
    # 切换到 Windows 环境
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Base Tools (Chocolatey for easy setup)
        run: |
          # 安装 Chocolatey 包管理器 (如果不存在)
          if (!(Get-Command choco -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy Bypass -Scope Process -Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          }
          choco install --no-progress ninja

      # 1. Setup vcpkg
      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          
          # 安装依赖：使用 x64-windows (MSVC) 三元组
          # 这是 vcpkg 官方支持最完善的组合
          .\vcpkg\vcpkg install `
            qt6-base:x64-windows `
            qt6-tools:x64-windows `
            qt6-svg:x64-windows `
            kcoreaddons:x64-windows `
            ki18n:x64-windows `
            kconfig:x64-windows `
            kwindowsystem:x64-windows `
            knotifications:x64-windows

      # 2. Configure & Build
      - name: Configure & Build
        run: |
          mkdir build
          cd build
          
          cmake .. `
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows ` # 使用 MSVC 动态链接
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=../install

          cmake --build . --config Release

      # 3. Package
      - name: Package with Dependencies
        run: |
          # 使用 vcpkg 自带的工具或手动复制
          mkdir -p release
          cp Debug/ktorrent.exe release/ # 或者 Release/，取决于 CMake 配置
          
          # MSVC 程序通常需要 vcredist，或者我们将 DLL 拷贝进去
          # 这里简单处理：假设 CMake 已经把依赖拷贝到了 bin 目录
          cp bin/*.dll release/ 2>$null
          
          # 打包
          Compress-Archive -Path release/* -DestinationPath ktorrent-windows.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ktorrent-windows
          path: ktorrent-windows.zip
