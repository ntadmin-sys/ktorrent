name: Build ktorrent for Windows

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-windows:
    runs-on: ubuntu-latest
    container:
      # ✅ 修复：直接使用官方地址，不要加 mirror.gcr.io
      image: registry.cn-hangzhou.aliyuncs.com/google_containers/registry.kde.org/craft/craft-blueprints:kf5-qt5-windows-msvc2019

    steps:
      - name: Checkout ktorrent source code
        uses: actions/checkout@v4

      - name: Build ktorrent for Windows
        run: |
          echo "Starting build process..."
          mkdir -p build
          cd build
          
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=/opt/kde \
            -DCMAKE_TOOLCHAIN_FILE=/opt/craft/cmake/toolchain-windows-msvc2019.cmake
          
          make -j$(nproc)
