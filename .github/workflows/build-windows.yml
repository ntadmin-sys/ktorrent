name: Build ktorrent for Windows (Native Cross-compile)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # 1. 安装基础依赖（包含旧版 ECM，作为基础）
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            qtbase5-dev \
            qttools5-dev \
            qttools5-dev-tools \
            libqt5svg5-dev \
            extra-cmake-modules \
            cmake \
            ninja-build \
            git

      # 2. 【新增步骤】手动编译安装最新版 ECM
      - name: Build and Install Latest ECM
        run: |
          echo "Building latest ECM (v5.240.0+)..."
          git clone --depth 1 https://invent.kde.org/frameworks/extra-cmake-modules.git /tmp/ecm
          cd /tmp/ecm
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release
          sudo make install
          # 清理缓存，防止 CMake 找到旧版缓存
          rm -rf /usr/share/ECM/cmake/ECMCache.cmake

      # 3. 配置项目
      - name: Configure Build (CMake)
        run: |
          mkdir -p build
          cd build
          
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_FIND_ROOT_PATH=/usr/x86_64-w64-mingw32 \
            -DCMAKE_INSTALL_PREFIX=/tmp/kde-install \
            -DCMAKE_BUILD_TYPE=Release

      # 4. 编译
      - name: Build Project
        run: |
          cd build
          make -j$(nproc)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ktorrent-windows-binary
          path: build/ktorrent.exe
