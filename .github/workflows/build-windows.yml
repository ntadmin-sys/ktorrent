name: Build ktorrent for Windows (Qt6 + MSVC)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Ninja
        run: |
          choco install --no-progress ninja

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "*"

      # ==================== 关键修复：只用官方源，无任何镜像 ====================
      - name: Setup vcpkg (Official, stable in CI)
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat

      # ==================== 克隆 KDE 官方 vcpkg 端口 ====================
      - name: Clone KDE vcpkg ports
        run: |
          git clone --depth 1 https://invent.kde.org/sdk/kde-vcpkg.git

      # ==================== 安装依赖（Qt6 + KDE） ====================
      - name: Install dependencies via vcpkg
        run: |
          .\vcpkg\vcpkg install `
            --overlay-ports=kde-vcpkg/ports `
            qtbase:x64-windows `
            qttools:x64-windows `
            qtsvg:x64-windows `
            kcoreaddons:x64-windows `
            ki18n:x64-windows `
            kconfig:x64-windows `
            kwindowsystem:x64-windows `
            knotifications:x64-windows

      # ==================== 编译 ====================
      - name: Configure & Build
        run: |
          mkdir build
          cd build
          
          cmake .. `
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_OVERLAY_PORTS=../kde-vcpkg/ports `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -GNinja

          cmake --build . --config Release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ktorrent-windows
          path: build/src/Release/ktorrent.exe
