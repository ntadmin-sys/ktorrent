name: Build ktorrent for Windows (Qt6 + MSVC)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # 1. 安装基础工具
      - name: Install Base Tools
        run: |
          # 使用 Chocolatey 安装 Ninja 构建系统
          choco install --no-progress ninja

      # 2. 设置 vcpkg 并强制注册 Qt 仓库
      - name: Setup vcpkg with Qt Registry
        run: |
          # 克隆 vcpkg 主仓库
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
          
          # 克隆 Qt 官方 ports 仓库 (这是解决 "qt6-base does not exist" 的关键)
          git clone --depth 1 https://github.com/microsoft/vcpkg-qtpackages.git vcpkg-qt-registry
          
          # 初始化 vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
          
          # 安装 Qt6 组件
          # 使用 --overlay-ports 强制指向我们刚才克隆的 Qt 仓库
          .\vcpkg\vcpkg install `
            --overlay-ports=./vcpkg-qt-registry/ports `
            qt6-base:x64-windows `
            qt6-tools:x64-windows `
            qt6-svg:x64-windows

      # 3. 安装 KDE Frameworks (KF6)
      - name: Install KDE Frameworks
        run: |
          # 安装 KDE 库
          # 注意：这里不需要 --overlay-ports，因为 KF6 在 vcpkg 主仓库中
          .\vcpkg\vcpkg install `
            kcoreaddons:x64-windows `
            ki18n:x64-windows `
            kconfig:x64-windows `
            kwindowsystem:x64-windows `
            knotifications:x64-windows

      # 4. 配置与构建项目
      - name: Configure & Build
        run: |
          mkdir build
          cd build
          
          cmake .. `
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -GNinja # 使用 Ninja 构建系统

          cmake --build . --config Release

      # 5. 打包依赖
      - name: Package Dependencies
        run: |
          # 创建发布目录
          mkdir release
          
          # 复制主程序 (假设生成的 exe 在 src 目录下，如果路径不对请调整)
          # 使用 -Force 防止因文件存在而报错
          Copy-Item -Path src/Release/ktorrent.exe -Destination release/ -Force
          
          # 复制所有 vcpkg 安装的 DLL (Qt, KDE, MSVC 运行时)
          Copy-Item -Path vcpkg/installed/x64-windows/bin/*.dll -Destination release/
          
          # 复制平台插件 (qwindows.dll)
          mkdir release/platforms
          Copy-Item -Path vcpkg/installed/x64-windows/plugins/platforms/qwindows.dll -Destination release/platforms/
          
          # 打包成 ZIP
          Compress-Archive -Path release/* -DestinationPath ktorrent-windows-qt6.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ktorrent-windows-qt6
          path: ktorrent-windows-qt6.zip
