name: Build ktorrent for Windows (Qt6 + MSVC)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          choco install --no-progress ninja

      # 修复 Git 安全配置（CI 必备）
      - name: Configure Git safe directory
        run: git config --global --add safe.directory "*"

 # 克隆 vcpkg（官方源，稳定）
git clone https://github.com/microsoft/vcpkg.git

# 进入目录并执行启动脚本
cd vcpkg
.\bootstrap-vcpkg.bat
      # 安装所有依赖（去掉了失效的 qtpackages，直接用官方 vcpkg 端口）
      - name: Install dependencies via vcpkg
        run: |
          .\vcpkg\vcpkg install `
            qt6-base:x64-windows `
            qt6-tools:x64-windows `
            qt6-svg:x64-windows `
            kcoreaddons:x64-windows `
            ki18n:x64-windows `
            kconfig:x64-windows `
            kwindowsystem:x64-windows `
            knotifications:x64-windows

      - name: Configure & Build
        run: |
          mkdir build
          cd build
          
          cmake .. `
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -GNinja

          cmake --build . --config Release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ktorrent-windows
          path: build/src/Release/ktorrent.exe
