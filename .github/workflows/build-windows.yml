name: Build ktorrent for Windows (Qt6 + MSVC)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Ninja (faster builds)
        run: |
          choco install --no-progress ninja

      # 1. Create vcpkg.json to register the Qt registry
      - name: Setup vcpkg with Qt Registry
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          
          # PowerShell 多行字符串
          $vcpkgJson = @"
          {
            "dependencies": [
              "qt6-base",
              "qt6-tools",
              "qt6-svg",
              "kcoreaddons",
              "ki18n",
              "kconfig",
              "kwindowsystem",
              "knotifications"
            ],
            "registries": [
              {
                "baseline": "f8f72ba852ba93e7391f845352c498a24c35cfe0",
                "packages": [ "qt6-*" ],
                "kind": "git",
                "repository": "https://github.com/microsoft/vcpkg-qtpackages.git"
              }
            ]
          }
          "@
          $vcpkgJson | Out-File -FilePath vcpkg\vcpkg.json -Encoding UTF8

          # 初始化 vcpkg
          .\vcpkg\bootstrap-vcpkg.bat

      # 2. Install Dependencies
      - name: Install Dependencies
        run: |
          # 使用 vcpkg 安装依赖
          .\vcpkg\vcpkg install `
            qt6-base:x64-windows `
            qt6-tools:x64-windows `
            qt6-svg:x64-windows `
            kcoreaddons:x64-windows `
            ki18n:x64-windows `
            kconfig:x64-windows `
            kwindowsystem:x64-windows `
            knotifications:x64-windows

      # 3. Configure & Build
      - name: Configure & Build
        run: |
          mkdir build
          cd build
          
          cmake .. `
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -GNinja

          cmake --build . --config Release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ktorrent-windows
          path: build/src/ktorrent.exe # 根据实际生成路径调整
