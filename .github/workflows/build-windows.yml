name: Build ktorrent for Windows (Qt6 + MSVC)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          choco install --no-progress ninja

      - name: Setup vcpkg and Qt Registry
        run: |
          # 1. 显式克隆 vcpkg (避免权限/TTY 错误)
          git clone https://github.com/microsoft/vcpkg.git
          
          # 2. 显式克隆 Qt Ports 仓库 (关键修复：避免 vcpkg 内部调用 git 导致的 TTY 错误)
          # 使用 --depth 1 减少下载量
          git clone --depth 1 https://github.com/microsoft/vcpkg-qtpackages.git vcpkg-qt-registry

          # 3. 初始化 vcpkg
          .\vcpkg\bootstrap-vcpkg.bat

          # 4. 安装 Qt 依赖 (使用 overlay-ports 指向我们刚刚克隆的文件夹)
          # 注意：这里路径使用的是 Windows 风格的反斜杠，或者直接使用相对路径
          .\vcpkg\vcpkg install `
            --overlay-ports=vcpkg-qt-registry/ports `
            qt6-base:x64-windows `
            qt6-tools:x64-windows `
            qt6-svg:x64-windows

      - name: Install KDE Frameworks
        run: |
          .\vcpkg\vcpkg install `
            kcoreaddons:x64-windows `
            ki18n:x64-windows `
            kconfig:x64-windows `
            kwindowsystem:x64-windows `
            knotifications:x64-windows

      - name: Configure & Build
        run: |
          mkdir build
          cd build
          
          cmake .. `
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -GNinja

          cmake --build . --config Release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ktorrent-windows
          path: build/src/Release/ktorrent.exe
